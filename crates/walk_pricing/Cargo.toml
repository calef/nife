# Name: the block lives in src/lib.rs, where `script/names` reads it.
[package]
name = "walk_pricing"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint (milestone 887) holds the exception
license.workspace = true

[lints]
workspace = true

[dependencies]
# The tree itself, test data since milestone 886 (the filesystem test fixture moves to its own
# crate) moved it out of the protocol crate: this crate prices walks over exactly the layout the
# test image ships, so the image builder, the priced program and a host run cannot disagree about
# what was walked.
filesystem_fixture = { version = "0.1.0", path = "../filesystem_fixture" }

[dev-dependencies]
# `examples/rg_host.rs` splits `fixture::walk::RG_SEARCH` with the function that builds nife's argv,
# so the host's `rg` hears the words nife's does per milestone 121 (`ripgrep` on nife).
grant_plan = { version = "0.1.0", path = "../grant_plan" }
