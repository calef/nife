[package]
name = "disk_tree"
version = "0.1.0"
edition = "2024"
publish = false     # the default; the allowlist lint holds the exception (crates/publish-allowlist.txt)
license.workspace = true

# no_std for the EL0 server (`components/src/disk_tree.rs`), std for host tests, like every §7
